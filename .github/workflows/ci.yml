name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: galgame-monorepo
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: galgame-monorepo/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 剧本与资源校验
        run: pnpm validate

      - name: 构建 Web 预览
        run: pnpm build:web

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Web 冒烟（无头 Chrome）
        run: pnpm smoke:web
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: 上传冒烟截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-screenshots
          path: galgame-monorepo/scripts/.smoke/web-*.png
          if-no-files-found: ignore
