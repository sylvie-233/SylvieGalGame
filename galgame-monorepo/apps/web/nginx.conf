server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/yaml;

    # 基础安全头。React 内联样式与 html-to-image 需要 style-src 'unsafe-inline'
    # 与 img-src data/blob。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # 构建产物带内容哈希，可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 剧本与美术资源可能随时替换，避免浏览器长期缓存旧内容
    location /game/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Nginx 默认 mime.types 不含 YAML；正则 location 优先级高于 /game/ 前缀
    location ~ \.(yaml|yml)$ {
        default_type text/yaml;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 'ok';
    }
}
