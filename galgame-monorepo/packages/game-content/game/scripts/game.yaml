title: 午后的回声
windowTitle: 午后的回声 · SylvieGalGame
version: 0.1.0
start: prologue

titleScreen:
  background: images/bg/title.svg
  bgm: audio/bgm/afternoon.wav
  subtitle: 一段由 YAML 写成的午后相遇
  showVersion: true

scenes:
  - prologue
  - smile_route
  - book_route
  - common

variables:
  affection: 0
  curiosity: 0
  knows_melody: false
  route: ""

chapters:
  prologue_start: "序章 · 午后的图书馆"
  smile_start: "第一章 · 热茶与窗边"
  book_start: "第一章 · 书页之间"
  common_start: "第二章 · 黄昏之前"
  smile_epilogue: "第二章 · 未说完的话"
  book_epilogue: "第二章 · 蓝封面的书"
  common_tail: "第二章 · 黄昏"
  melody_ending: "尾声 · 旋律的休止符"
  quiet_ending: "尾声 · 安静的黄昏"
  common_end: "尾声"

endings:
  - id: melody
    title: "旋律的休止符"
    description: "你们在闭馆铃里哼完那段旋律，故事落下了第一个休止符。"
  - id: quiet
    title: "安静的黄昏"
    description: "你们把书一本本收好，约好明天还来。故事在一个普通的黄昏翻页。"

gallery:
  cgs:
    - { id: book_glow, image: images/cg/book_glow.svg, title: "书页微光" }
    - { id: tea_steam, image: images/cg/tea_steam.svg, title: "热茶的白汽" }
  bgms:
    - { id: afternoon, track: audio/bgm/afternoon.wav, title: "午后" }
    - { id: sunset, track: audio/bgm/sunset.wav, title: "黄昏" }
