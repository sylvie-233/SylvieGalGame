endings:
  - id: melody
    title: "找零"
    description: "她把十元硬币塞回你手心，说下次再还。可第二天，她就离开了。"
  - id: quiet
    title: "末班车"
    description: "最后一班车已经开走。你们沿着河边走回去，谁也没有提明天。"
  - id: echo
    title: "回声之外"
    description: "你们约好明年同一台售货机再见。春天来临时，回信和一枚十元硬币一起抵达。"

