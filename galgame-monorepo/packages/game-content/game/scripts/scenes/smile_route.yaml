name: smile_route
imports:
  - common

commands:
  - label: smile_start

  - set:
      var: route
      op: "="
      value: "smile"
  - set:
      var: affection
      op: "+="
      value: 3
  - set:
      var: curiosity
      op: "+="
      value: 1

  - se:
      sound: audio/se/coin.wav
      volume: 0.6

  - text:
      speaker: 旁白
      text: "我把硬币投进去，按下最上面那罐黑咖啡。机器亮了一下，像终于等到一个答案。"

  - sprite:
      id: sylvie
      image: images/sprite/sylvie_neutral.svg
      position: center
      duration: 500

  - text:
      speaker: 希尔维
      text: "……你买了？"
      voice: audio/voice/sylvie_02.wav
  - text:
      speaker: 我
      text: "嗯。热的。"
  - text:
      speaker: 希尔维
      text: "我不是说想要吗？"
      voice: audio/voice/sylvie_03.wav
  - text:
      speaker: 我
      text: "你刚才说，热的，什么都行。"

  - se:
      sound: audio/se/can.wav
      volume: 0.6

  - text:
      speaker: 旁白
      text: "她接过罐子，指尖在拉环上停了停。热气从开口冒出来，很快被夜风吹散。"

  - text:
      speaker: 希尔维
      text: "谢谢。"
      voice: audio/voice/sylvie_05.wav
  - text:
      speaker: 旁白
      text: "这是今晚她第一次说这两个字。也是第一次，没有马上把脸转开。"

  - label: smile_library

  - bg:
      image: images/bg/library_tea.svg
      transition: fade
      duration: 900
  - bgm:
      track: audio/bgm/afternoon.wav
      fade: 900
      loop: true

  - sprite:
      id: sylvie
      image: images/sprite/sylvie_smile.svg
      position: center
      duration: 500

  - text:
      speaker: 旁白
      text: "第二天下午，她真的来了图书馆。桌上放着两只纸杯，杯壁上凝着水汽，像昨天夜里没有说完的话。"
  - text:
      speaker: 我
      text: "这次多少钱？"
  - text:
      speaker: 希尔维
      text: "一百二十元。你昨天已经付过了。"
      voice: audio/voice/sylvie_01.wav
  - text:
      speaker: 我
      text: "那今天这杯呢？"
  - text:
      speaker: 希尔维
      text: "算利息。"
      voice: audio/voice/sylvie_04.wav

  - se:
      sound: audio/se/tea_cup.wav
      volume: 0.5

  - cg:
      image: images/cg/tea_steam.svg
      transition: fade
      duration: 800

  - text:
      speaker: 旁白
      text: "热气在午后的光里升起来。她双手捧着纸杯，像捧着一件很容易碎的东西。"
  - text:
      speaker: 希尔维
      text: "我不太会和人待在一起。"
      voice: audio/voice/sylvie_02.wav
  - text:
      speaker: 我
      text: "看出来了。"
  - text:
      speaker: 希尔维
      text: "你也一样。"
      voice: audio/voice/sylvie_05.wav

  - cg: hide

  - label: smile_rooftop

  - text:
      speaker: 旁白
      text: "放学后，她带我上了便利店旁边的旧楼。楼梯间的灯坏了一半，她走在前面，脚步却没有一点犹豫。"

  - bg:
      image: images/bg/rooftop_sunset.svg
      transition: slide-left
      duration: 1100
  - bgm:
      track: audio/bgm/rooftop.wav
      fade: 900
      loop: true

  - sprite:
      id: sylvie
      image: images/sprite/sylvie_neutral.svg
      position: center
      duration: 500

  - text:
      speaker: 希尔维
      text: "这里是我发现的第二个秘密。"
      voice: audio/voice/sylvie_03.wav
  - text:
      speaker: 我
      text: "第一个是什么？"
  - text:
      speaker: 希尔维
      text: "不告诉你。"
      voice: audio/voice/sylvie_04.wav

  - cg:
      image: images/cg/rooftop_sky.svg
      transition: wipe
      duration: 900

  - text:
      speaker: 旁白
      text: "风从楼群之间穿过来，把她的头发吹到一边。远处的高架桥亮起第一排车灯，像一条慢慢醒来的河。"
  - text:
      speaker: 希尔维
      text: "下个月，我要转学了。"
      voice: audio/voice/sylvie_05.wav
  - text:
      speaker: 旁白
      text: "她说得很平静，像在念一条已经背熟的天气预报。"
  - text:
      speaker: 希尔维
      text: "我妈说，换个城市也许会好一点。"
      voice: audio/voice/sylvie_02.wav
  - text:
      speaker: 我
      text: "会吗？"
  - text:
      speaker: 希尔维
      text: "不知道。但这里的每一条走廊，我都已经走腻了。"
      voice: audio/voice/sylvie_05.wav

  - text:
      speaker: 旁白
      text: "她说“腻”的时候，手指一直抠着空罐上的拉环。那罐咖啡她昨晚喝得很慢，最后一口留在罐底，像故意剩下的一点什么。"
  - text:
      speaker: 我
      text: "我讨厌告别。"
  - text:
      speaker: 希尔维
      text: "我也是。所以我们别告别。"
      voice: audio/voice/sylvie_01.wav

  - cg: hide
  - wait: 500

  - jump: "common#common_start"
